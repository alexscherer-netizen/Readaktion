<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuchsbau Redaktion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#101821; --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EDEC;
  --line:#D5DCDA; --line-strong:#B6C1BE; --text:#101821; --text-2:#5A6872; --text-3:#8A959D;
  --accent:#1D4E6B; --accent-soft:#E3ECF2; --court:#1D4E6B; --court-soft:#E3ECF2;
  --win:#1C7A52; --draw:#9A6B0C; --loss:#B32A20;
  --win-soft:#E3F2EA; --draw-soft:#FAF0DC; --loss-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(16,24,33,.06), 0 6px 18px rgba(16,24,33,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#070B10; --bg:#0D1219; --surface:#151D26; --surface-2:#1D2731;
    --line:#2A3641; --line-strong:#3C4B58; --text:#E8EDEF; --text-2:#9FADB7; --text-3:#76848E;
    --accent:#6FB2DB; --accent-soft:#152735; --court:#FF7A4D; --court-soft:#3A1E13;
    --win:#4FC48C; --draw:#E0B156; --loss:#FF7B6E;
    --win-soft:#12281E; --draw-soft:#2B2312; --loss-soft:#2E1917;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#070B10; --bg:#0D1219; --surface:#151D26; --surface-2:#1D2731;
  --line:#2A3641; --line-strong:#3C4B58; --text:#E8EDEF; --text-2:#9FADB7; --text-3:#76848E;
  --accent:#6FB2DB; --accent-soft:#152735; --court:#FF7A4D; --court-soft:#3A1E13;
  --win:#4FC48C; --draw:#E0B156; --loss:#FF7B6E;
  --win-soft:#12281E; --draw-soft:#2B2312; --loss-soft:#2E1917;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--text); margin:0;
  font-family:"IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif; font-size:15px; line-height:1.5}
img{max-width:100%}
[hidden]{display:none !important}
h1,h2,h3,h4{margin:0; font-family:"Barlow Condensed","IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:.01em; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}

.board{position:relative; overflow:hidden; background:var(--ink); color:#F4F7F6}
.board .court{position:absolute; inset:0; width:100%; height:100%; opacity:.5}
.board .inner{position:relative; padding:20px 16px 16px; max-width:1040px; margin:0 auto}
.eyebrow{font-family:"Barlow Condensed",sans-serif; font-size:13px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; color:#FF9470}
.board h1{font-size:clamp(30px,8vw,46px); line-height:.98; text-transform:uppercase; margin:4px 0 2px}
.board .lede{color:#9FB0BC; font-size:13.5px; max-width:56ch; margin:0}
.board .statstrip{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.chipstat{display:flex; flex-direction:column; gap:1px; background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 10px; min-width:78px}
.chipstat b{font-family:"Barlow Condensed",sans-serif; font-size:21px; line-height:1.05; font-variant-numeric:tabular-nums}
.chipstat span{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:#93A5B1}
.board .authbar{position:absolute; top:10px; right:14px; display:flex; gap:6px; align-items:center; z-index:2}
.board .authbar .who{font-size:11px; color:#93A5B1}
.minibtn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#F4F7F6;
  border-radius:7px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer}
.minibtn:hover{background:rgba(255,255,255,.18)}

.wrap{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:0 40px}
.rail{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.rail .inner{max-width:1040px; margin:0 auto; padding:9px 16px; display:flex; gap:8px; overflow-x:auto; align-items:center}
.md{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-start;
  border:1px solid var(--line-strong); background:var(--surface); border-radius:8px;
  padding:5px 11px; cursor:pointer; text-align:left; line-height:1.2}
.md b{font-family:"Barlow Condensed",sans-serif; font-size:16px; white-space:nowrap}
.md span{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); white-space:nowrap}
.md[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.md[aria-current="true"] span{color:rgba(255,255,255,.85)}
.md.add{border-style:dashed; color:var(--accent); justify-content:center}

.tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-top:10px}
.tab{flex:0 0 auto; background:none; border:0; border-bottom:2.5px solid transparent;
  padding:9px 12px 8px; cursor:pointer; color:var(--text-2); font-weight:600; font-size:13.5px; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); margin-top:14px; overflow:hidden}
.panel > header{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:12px 14px 10px; border-bottom:1px solid var(--line)}
.panel > header h2{font-size:19px; text-transform:uppercase; letter-spacing:.04em}
.panel > header .sub{font-size:11.5px; color:var(--text-3); letter-spacing:.06em; text-transform:uppercase}
.panel .body{padding:14px}
.empty{padding:22px 14px; text-align:center; color:var(--text-3); font-size:13.5px}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.tile{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface-2)}
.tile b{display:block; font-family:"Barlow Condensed",sans-serif; font-size:27px; line-height:1.05; font-variant-numeric:tabular-nums}
.tile span{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3)}
.tile small{display:block; font-size:12px; color:var(--text-2); margin-top:2px}

.badge{display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:30px; height:30px; border-radius:7px; font-family:"Barlow Condensed",sans-serif;
  font-weight:700; font-size:12.5px; color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.35);
  border:1px solid rgba(0,0,0,.18); overflow:hidden}
.badge.lg{width:38px; height:38px; font-size:15px; border-radius:9px}
.badge.img{background:var(--surface); border-color:var(--line); padding:2px; text-shadow:none}
.badge.img img{width:100%; height:100%; object-fit:contain; display:block}
.teamline{display:flex; align-items:center; gap:8px; min-width:0}
.teamline span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.game{border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:10px; background:var(--surface)}
.game .top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  padding:7px 11px; background:var(--surface-2); border-bottom:1px solid var(--line);
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-2)}
.game .mid{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:12px 11px}
.game .side{display:flex; align-items:center; gap:8px; min-width:0; font-weight:600}
.game .side.away{flex-direction:row-reverse; text-align:right}
.game .side em{font-style:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.score{font-family:"Barlow Condensed",sans-serif; font-size:31px; font-weight:700;
  font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap; text-align:center}
.score small{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:11px; font-weight:500; color:var(--text-3); margin-top:3px}
.game .notes{padding:0 11px 11px; font-size:13px; color:var(--text-2); display:grid; gap:4px}
.game .notes b{color:var(--text); font-weight:600}
.resbar{width:5px; align-self:stretch}

.pill{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:999px; border:1px solid transparent; white-space:nowrap}
.p-win{background:var(--win-soft); color:var(--win); border-color:color-mix(in srgb,var(--win) 30%,transparent)}
.p-draw{background:var(--draw-soft); color:var(--draw); border-color:color-mix(in srgb,var(--draw) 30%,transparent)}
.p-loss{background:var(--loss-soft); color:var(--loss); border-color:color-mix(in srgb,var(--loss) 30%,transparent)}
.p-neutral{background:var(--surface-2); color:var(--text-2); border-color:var(--line)}
.p-accent{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.p-court{background:var(--court-soft); color:var(--court); border-color:color-mix(in srgb,var(--court) 30%,transparent)}

.item{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1; min-width:0}
.item .main h4{font-family:"IBM Plex Sans",sans-serif; font-size:14.5px; font-weight:600; letter-spacing:0}
.item .meta{font-size:12.5px; color:var(--text-2); margin-top:2px}
.item .meta .src{color:var(--text-3); font-size:11.5px; word-break:break-word}
.rowacts{display:flex; gap:4px; flex:0 0 auto}

.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:6px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); font-weight:600}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--accent)}
th .arr{opacity:.9}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
tr.me td{background:var(--accent-soft); font-weight:600}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; padding:0 0 12px; border-bottom:1px dashed var(--line); margin-bottom:12px}
.filters label.f{min-width:135px}
.chipbtn{border:1px solid var(--line-strong); background:var(--surface); border-radius:999px;
  padding:5px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-2)}
.chipbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong);
  background:var(--surface); border-radius:8px; padding:7px 12px; font-size:13.5px; font-weight:600; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{border-color:transparent; background:transparent; color:var(--text-2); padding:5px 7px}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn.danger:hover{background:var(--loss-soft); color:var(--loss)}

form.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
form.grid .full{grid-column:1/-1}
label.f{display:flex; flex-direction:column; gap:3px; font-size:11px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--text-3); font-weight:600; min-width:0}
label.f input, label.f select, label.f textarea{
  border:1px solid var(--line-strong); background:var(--bg); border-radius:7px; padding:7px 9px;
  font-size:14px; letter-spacing:normal; text-transform:none; color:var(--text); width:100%; min-width:0}
label.f textarea{min-height:66px; resize:vertical; line-height:1.45}
.formfoot{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
.hint{font-size:12px; color:var(--text-3)}
fieldset{border:1px dashed var(--line-strong); border-radius:9px; padding:12px; margin:14px 0 0}
legend{font-family:"Barlow Condensed",sans-serif; font-size:14px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); padding:0 6px}

dialog{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text);
  padding:0; width:min(560px, calc(100vw - 32px)); box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,22,.55)}
dialog .dhead{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--line)}
dialog .dhead h3{font-size:18px; text-transform:uppercase; letter-spacing:.05em}
dialog .dbody{padding:14px; max-height:70vh; overflow-y:auto}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:#F4F7F6; padding:9px 15px; border-radius:999px; font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:60; max-width:calc(100vw - 32px)}
.banner{display:flex; gap:9px; align-items:flex-start; border-radius:9px; padding:10px 12px; font-size:13px; margin-top:14px;
  border:1px solid color-mix(in srgb,var(--court) 30%,transparent); background:var(--court-soft)}
.banner.warn{border-color:color-mix(in srgb,var(--loss) 35%,transparent); background:var(--loss-soft)}
.banner b{color:var(--court)}
.banner.warn b{color:var(--loss)}
.foot{margin-top:24px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--text-3)}
.logorow{display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--line)}
.logorow:first-child{border-top:0}
.logorow .nm{flex:1; min-width:0; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- News ---------- */
.news{border:1px solid var(--line); border-left:3px solid var(--line-strong); border-radius:9px;
  padding:10px 12px; margin-bottom:9px; background:var(--surface)}
.news.breaking{border-left-color:var(--loss); background:var(--loss-soft)}
.news.wichtig{border-left-color:var(--accent)}
.news h4{font-family:"IBM Plex Sans",sans-serif; font-size:15px; font-weight:600; letter-spacing:0; margin-bottom:3px}
.news .line{display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:5px}
.news p{margin:0 0 5px; font-size:13.5px; color:var(--text-2)}
.news .src{font-size:11.5px; color:var(--text-3); word-break:break-word}
.news .src a{color:var(--court)}
.news .conflict{font-size:12.5px; color:var(--draw); background:var(--draw-soft); border-radius:6px; padding:5px 8px; margin:5px 0}
.badgerow{display:flex; gap:4px; flex-wrap:wrap; margin:4px 0}

/* ---------- Form-Punkte ---------- */
.formdots{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.dot{width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center;
  font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:14px; color:#fff}
.dot.w{background:var(--win)} .dot.d{background:var(--draw)} .dot.l{background:var(--loss)}

/* ---------- Countdown ---------- */
.count{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.count div{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:5px 10px; min-width:58px; text-align:center}
.count b{display:block; font-family:"Barlow Condensed",sans-serif; font-size:22px; line-height:1.1; font-variant-numeric:tabular-nums}
.count span{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3)}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:6px 14px; font-size:13.5px}
.kv div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:4px 0}
.kv div span:first-child{color:var(--text-3)}
.kv div span:last-child{text-align:right; font-weight:500}

/* ---------- Impressum ---------- */
.legal .kv{grid-template-columns:1fr; max-width:460px}
.legal .kv div span:first-child{white-space:nowrap}
.legal p{margin:0; max-width:74ch; font-size:13.5px}
.legal p + p{margin-top:10px}
.legal p.hint{overflow-wrap:anywhere}
.legal a{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
.legal a.btn{text-decoration:none; color:#fff}
.legal a.btn:hover{filter:brightness(1.08)}
.legal ul.list{margin:0; padding-left:19px; max-width:74ch; display:grid; gap:7px; font-size:13.5px}
.legal ul.list li{line-height:1.5}
.legal code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 5px; word-break:break-word}

@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
@media (max-width:460px){ .score{font-size:26px} .board .inner{padding:34px 16px 14px} }
</style>
</head>

const REST = SUPA_URL + "/rest/v1/";
const AUTH = SUPA_URL + "/auth/v1/";
const SESS_KEY = "fuchsbau_session";
let session = null;

function setSession(d){
  if(d && d.access_token){
    session = { access_token:d.access_token, refresh_token:d.refresh_token,
      expires_at: d.expires_at || (Math.floor(Date.now()/1000) + (d.expires_in||3600)),
      email: (d.user && d.user.email) || (session && session.email) || "" };
  } else session = null;
  try{ session ? localStorage.setItem(SESS_KEY, JSON.stringify(session)) : localStorage.removeItem(SESS_KEY); }catch(e){}
}
function headers(json){
  const h = { apikey: SUPA_KEY, Authorization: "Bearer " + ((session && session.access_token) || SUPA_KEY) };
  if(json) h["Content-Type"] = "application/json";
  return h;
}
async function rest(path, opts){
  const r = await fetch(REST + path, opts || { headers: headers() });
  if(!r.ok){
    const t = await r.text(); let msg = t;
    try{ const j = JSON.parse(t); msg = j.message || j.hint || t; }catch(e){}
    throw new Error(r.status + " – " + String(msg).slice(0,200));
  }
  if(r.status === 204) return null;
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
const q = (table, query) => rest(table + "?" + query);
const insertRow = (table,row) => rest(table, {method:"POST",
  headers:Object.assign(headers(true),{Prefer:"return=representation"}), body:JSON.stringify(row)});
const updateRow = (table,id,row) => rest(table + "?id=eq." + encodeURIComponent(id),
  {method:"PATCH", headers:headers(true), body:JSON.stringify(row)});
const upsertRow = (table,row,conflict) => rest(table + "?on_conflict=" + conflict, {method:"POST",
  headers:Object.assign(headers(true),{Prefer:"resolution=merge-duplicates,return=representation"}), body:JSON.stringify(row)});
const deleteWhere = (table,col,val) => rest(table + "?" + col + "=eq." + encodeURIComponent(val), {method:"DELETE", headers:headers()});

/* Nur eine einzige Kennung darf die Redaktion öffnen. Verglichen wird die
   Prüfsumme der Adresse, klein geschrieben und ohne Leerzeichen – damit passt
   auch eine Eingabe mit Großbuchstaben. */
async function checkEditor(mail){
  const norm = String(mail||"").trim().toLowerCase();
  if(!norm) return false;
  if(!(window.crypto && crypto.subtle))
    throw new Error("Dieser Browser kann die Kennung nicht prüfen. Bitte die Seite über https aufrufen oder einen aktuellen Browser verwenden.");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex === EDITOR_HASH;
}
async function login(email, password){
  const r = await fetch(AUTH + "token?grant_type=password", {method:"POST",
    headers:{apikey:SUPA_KEY,"Content-Type":"application/json"}, body:JSON.stringify({email,password})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error_description || d.msg || d.message || ("Fehler " + r.status));
  setSession(d);
  let ok = false;
  try{ ok = !!session && await checkEditor(session.email); }
  catch(err){ await logout(); throw err; }
  if(!ok){
    await logout();
    throw new Error("Diese Kennung ist für die Redaktion nicht freigeschaltet.");
  }
  return session;
}
async function refreshSession(){
  if(!session || !session.refresh_token) return null;
  const r = await fetch(AUTH + "token?grant_type=refresh_token", {method:"POST",
    headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){ setSession(null); return null; }
  setSession(await r.json());
  let ok = false;
  try{ ok = !!session && await checkEditor(session.email); }catch(e){ ok = false; }
  if(!ok){ setSession(null); return null; }
  return session;
}
async function logout(){
  try{ await fetch(AUTH + "logout", {method:"POST", headers:headers(true)}); }catch(e){}
  setSession(null);
}
async function restoreSession(){
  try{ const raw = localStorage.getItem(SESS_KEY); if(raw) session = JSON.parse(raw); }catch(e){ session=null; }
  /* Eine gespeicherte Sitzung einer anderen Kennung wird verworfen, nicht weiterverwendet. */
  let ok = false;
  try{ ok = !!session && await checkEditor(session.email); }catch(e){ ok = false; }
  if(!ok) setSession(null);
}

const mine = g => g.home===ME || g.away===ME;

function myGames(){ return state.games.filter(mine); }
function nextGame(){
  const now = Date.now();
  /* Verlegte Partien haben keinen Termin und sind deshalb nie das nächste Spiel. */
  const offen = myGames().filter(g=>g.status!=="beendet" && g.status!=="verlegt")
    .sort((a,b)=> gkey(a)<gkey(b)?-1:1);
  return offen.find(g=>{ const d=gameStart(g); return !d || d.getTime() > now - 3*3600*1000; })
    || offen[0] || null;
}

  return myGames().filter(g=>g.status==="beendet").sort((a,b)=> gkey(a)<gkey(b)?-1:1).pop() || null;
}
function opponentOf(g){ return g ? (g.home===ME ? g.away : g.home) : null; }
function scoutingFor(g){
  if(!g || !g.matchday_id) return null;
  return state.scouting.find(s=>s.matchday_id===g.matchday_id) || null;
}
function outcomeFor(team,g){
  if(g.status!=="beendet"||g.gh==null||g.ga==null) return null;
  const home = g.home===team, away = g.away===team;
  if(!home && !away) return null;
  const mineG = home?g.gh:g.ga, th = home?g.ga:g.gh;
  return { res: mineG>th?"w":mineG<th?"l":"d", gf:mineG, ga:th, opp: home?g.away:g.home, home };
}
function formOf(team,n){
  return state.games.filter(g=>(g.home===team||g.away===team) && g.status==="beendet")
    .sort((a,b)=> gkey(a)<gkey(b)?-1:1).slice(-(n||5))
    .map(g=>Object.assign({g}, outcomeFor(team,g)));
}

  return state.games.filter(g=>((g.home===teamA&&g.away===teamB)||(g.home===teamB&&g.away===teamA)) && g.status==="beendet")
    .sort((a,b)=> gkey(a)<gkey(b)?-1:1).slice(-(n||5)).reverse();
}
function latestStandings(){
  for(const m of state.matchdays){
    const s = state.standings.find(x=>x.matchday_id===m.id);
    if(s && Array.isArray(s.rows) && s.rows.length) return s;
  }
  return null;
}
function computeTable(rows){
  return (rows||[]).map(r=>{
    const sp=(r.w||0)+(r.d||0)+(r.l||0);
    return Object.assign({},r,{sp,pts:(r.w||0)*2+(r.d||0),neg:(r.l||0)*2+(r.d||0),diff:(r.gf||0)-(r.ga||0)});
  }).sort((a,b)=> b.pts-a.pts || b.diff-a.diff || (b.gf||0)-(a.gf||0) || a.team.localeCompare(b.team))
   .map((r,i)=>Object.assign(r,{pos:i+1}));
}
function rankOf(team){
  const s=latestStandings(); if(!s) return null;
  const r=computeTable(s.rows).find(x=>x.team===team); return r||null;
}
function isFresh(n){
  if(!n.published_at) return false;
  return (Date.now() - new Date(n.published_at).getTime()) < 72*3600*1000;
}

function alleMeldungen(){
  return state.news.slice().sort((a,b)=>{
    const ka=a.published_at||a.created_at||"", kb=b.published_at||b.created_at||"";
    return ka<kb ? 1 : ka>kb ? -1 : 0;
  });
}
function gefilterteMeldungen(){
  const f = state.fTicker;
  let list = alleMeldungen();
  if(f.scope)  list=list.filter(n=>n.scope===f.scope);
  if(f.cat)    list=list.filter(n=>n.category===f.cat);
  if(f.status) list=list.filter(n=>n.status===f.status);
  if(f.tage){
    const grenze = Date.now() - Number(f.tage)*24*3600*1000;
    list=list.filter(n=>{ const d=n.published_at?new Date(n.published_at).getTime():NaN;
      return isNaN(d) ? false : d>=grenze; });
  }
  if(f.q){
    const q=f.q.toLowerCase();
    const treffer = n => [n.title,n.summary,n.category,n.source_name]
      .concat(n.teams||[]).concat(n.players||[])
      .some(v=>String(v||"").toLowerCase().includes(q));
    list=list.filter(treffer);
  }
  return list;
}

/* ---- Bausteine ---- */
function newsCard(n, mitBereich){
  const cls = n.importance==="breaking" ? "breaking" : n.importance==="wichtig" ? "wichtig" : "";
  const pills = [
    mitBereich && SCOPE_LABEL[n.scope] ? `<span class="pill p-court">${esc(SCOPE_LABEL[n.scope])}</span>` : "",
    n.importance==="breaking" ? `<span class="pill p-loss">Breaking News</span>` : "",
    n.is_update ? `<span class="pill p-accent">Update</span>` : "",
    isFresh(n) ? `<span class="pill p-win">Neu</span>` : "",
    `<span class="pill p-neutral">${esc(n.category||"")}</span>`,
    `<span class="pill ${n.status==="BESTÄTIGT"?"p-court":"p-draw"}">${esc(n.status||"")}</span>`
  ].join("");
  const teams = (n.teams||[]).map(t=>badge(t)).join("");
  return `<article class="news ${cls}">
    <div class="line">${pills}</div>
    <h4>${esc(n.title)}</h4>
    ${teams?`<div class="badgerow">${teams}</div>`:""}
    ${n.summary?`<p>${esc(n.summary)}</p>`:""}
    ${n.conflict_note?`<div class="conflict"><strong>Abweichende Angaben:</strong> ${esc(n.conflict_note)}</div>`:""}
    <div class="src">${deDT(n.published_at,n.published_time_known)} · ${esc(n.source_name||"Quelle nicht angegeben")}
      ${n.source_url?` · <a href="${esc(n.source_url)}" target="_blank" rel="noopener">Quelle öffnen</a>`:""}</div>
    ${state.isEditor?`<div class="rowacts" style="margin-top:7px">
      <button class="btn sm" data-edit="news" data-id="${esc(n.id)}">Bearbeiten</button>
      <button class="btn sm danger" data-del="fb_news" data-id="${esc(n.id)}">Löschen</button></div>`:""}
  </article>`;
}
function gameCard(g, plain){
  const o = mine(g) ? (outcomeFor(ME,g)||{}).res : null;
  const bar = o==="w"?"var(--win)":o==="l"?"var(--loss)":o==="d"?"var(--draw)":"var(--line-strong)";
  const pill = o==="w"?`<span class="pill p-win">Sieg</span>`:o==="l"?`<span class="pill p-loss">Niederlage</span>`
    :o==="d"?`<span class="pill p-draw">Unentschieden</span>`
    :g.status==="verlegt"?`<span class="pill p-draw">verlegt</span>`
    :`<span class="pill p-neutral">${esc(g.status||"angesetzt")}</span>`;
  const sc=(g.gh!=null&&g.ga!=null)?`${g.gh}:${g.ga}`:"–:–";
  const ht=(g.hh!=null&&g.ha!=null)?`(${g.hh}:${g.ha})`:"";
  const notes=[ g.scorers?`<div><b>Beste Werfer:</b> ${esc(g.scorers)}</div>`:"",
    g.keeper?`<div><b>Torhüter:</b> ${esc(g.keeper)}</div>`:"",
    g.penalties?`<div><b>Zeitstrafen / Besonderes:</b> ${esc(g.penalties)}</div>`:"",
    g.course?`<div><b>Verlauf:</b> ${esc(g.course)}</div>`:"",
    g.source?`<div class="hint">Quelle: ${esc(g.source)}${g.verif?" · "+esc(g.verif):""}</div>`:""].join("");
  return `<article class="game"><div style="display:flex"><div class="resbar" style="background:${bar}"></div><div style="flex:1;min-width:0">
    <div class="top"><span>${esc(g.competition||"")}${g.round?" · "+esc(g.round):""}</span>
      <span>${esc(gameDate(g))}${g.match_time?", "+esc(g.match_time)+" Uhr":""}${g.venue?" · "+esc(g.venue):""}</span>${pill}</div>
    <div class="mid"><div class="side">${badge(g.home)}<em>${esc(g.home||"")}</em></div>
      <div class="score">${esc(sc)}<small>${esc(ht)}${g.spectators?" · "+esc(String(g.spectators))+" Zuschauer":""}</small></div>
      <div class="side away">${badge(g.away)}<em>${esc(g.away||"")}</em></div></div>
    ${notes?`<div class="notes">${notes}</div>`:""}
    ${plain||!state.isEditor?"":`<div class="notes"><div class="rowacts">
      <button class="btn sm" data-edit="games" data-id="${esc(g.id)}">Bearbeiten</button>
      <button class="btn sm danger" data-del="fb_games" data-id="${esc(g.id)}">Löschen</button></div></div>`}
  </div></div></article>`;
}
function formDots(team,n){
  const f=formOf(team,n||5);
  if(!f.length) return `<span class="hint">Keine beendeten Spiele erfasst.</span>`;
  return `<div class="formdots">${f.map(x=>`<span class="dot ${x.res}" title="${esc(x.g.match_date)} ${esc(x.opp)} ${x.gf}:${x.ga}">${x.res==="w"?"S":x.res==="d"?"U":"N"}</span>`).join("")}</div>`;
}
function formTable(team,n){
  const f=formOf(team,n||5).reverse();
  if(!f.length) return `<p class="hint">Keine beendeten Spiele in der Datenbank.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Gegner</th><th class="c">H/A</th>
    <th class="n">Ergebnis</th><th class="c">S/U/N</th><th>Wettbewerb</th></tr></thead><tbody>
    ${f.map(x=>`<tr><td>${deDate(x.g.match_date)}</td><td>${teamline(x.opp)}</td>
      <td class="c">${x.home?"H":"A"}</td><td class="n">${x.gf}:${x.ga}</td>
      <td class="c"><span class="pill ${x.res==="w"?"p-win":x.res==="d"?"p-draw":"p-loss"}">${x.res==="w"?"Sieg":x.res==="d"?"Unent.":"Niederl."}</span></td>
      <td>${esc(x.g.competition||"")}</td></tr>`).join("")}</tbody></table></div>`;
}
function countdownBox(g){
  const d=gameStart(g); if(!d) return "";
  return `<div class="count" id="cdown" data-ts="${d.getTime()}"></div>`;
}
let cdTimer=null;
function startCountdown(){
  if(cdTimer) clearInterval(cdTimer);
  const tick=()=>{
    const el=document.getElementById("cdown"); if(!el){ clearInterval(cdTimer); cdTimer=null; return; }
    let s=Math.floor((Number(el.dataset.ts)-Date.now())/1000);
    if(s<=0){ el.innerHTML=`<div style="min-width:auto"><b>Anwurf</b><span>läuft oder vorbei</span></div>`; return; }
    const d=Math.floor(s/86400); s-=d*86400;
    const h=Math.floor(s/3600); s-=h*3600;
    const m=Math.floor(s/60); s-=m*60;
    el.innerHTML = [[d,"Tage"],[h,"Std"],[m,"Min"],[s,"Sek"]]
      .map(([v,l])=>`<div><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
  };
  tick(); cdTimer=setInterval(tick,1000);
}

/* ---- Kadertabelle, für die Füchse wie für den Gegner ---- */
function squadPanel(team, titel, sub){
  const sq = state.squad.filter(p=>p.team===team);
  if(!sq.length) return "";
  const eigen = team===ME;
  const num = p => { const n=parseInt(p.shirt_no,10); return isNaN(n) ? 999 : n; };

  const rows = sq.slice().sort((a,b)=> eigen ? num(a)-num(b) : (b.is_key?1:0)-(a.is_key?1:0));

  let list=state.games.slice().sort((a,b)=> gkey(a)<gkey(b)?-1:1);
  if(f.dir==="desc") list.reverse();
  if(f.comp) list=list.filter(g=>g.competition===f.comp);
  if(f.team) list=list.filter(g=>g.home===f.team||g.away===f.team);
  if(f.onlyMe) list=list.filter(mine);
  if(f.state==="kommend") list=list.filter(g=>g.status!=="beendet");
  if(f.state==="beendet") list=list.filter(g=>g.status==="beendet");
  const bar=`<div class="filters">
    <label class="f"><span>Wettbewerb</span><select data-fg="comp"><option value="">alle</option>
      ${comps.map(c=>`<option${c===f.comp?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <label class="f"><span>Mannschaft</span><select data-fg="team"><option value="">alle</option>
      ${teams.map(c=>`<option${c===f.team?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <label class="f"><span>Zeitraum</span><select data-fg="state">
      <option value=""${f.state===""?" selected":""}>alle</option>
      <option value="kommend"${f.state==="kommend"?" selected":""}>kommende Spiele</option>
      <option value="beendet"${f.state==="beendet"?" selected":""}>beendete Spiele</option></select></label>
    <label class="f"><span>Sortierung</span><select data-fg="dir">
      <option value="asc"${f.dir==="asc"?" selected":""}>Datum aufsteigend</option>
      <option value="desc"${f.dir==="desc"?" selected":""}>Datum absteigend</option></select></label>
    <button class="chipbtn" data-toggle="onlyMe" aria-pressed="${f.onlyMe}">Nur Füchse-Spiele</button>
    ${(f.comp||f.team||f.onlyMe||f.state)?`<button class="chipbtn" data-reset="fGames">Filter zurücksetzen</button>`:""}</div>`;
  const upcoming=state.games.filter(g=>g.status!=="beendet"&&mine(g)).sort((a,b)=> gkey(a)<gkey(b)?-1:1);
  let out="";
  if(upcoming.length) out += panel("Kommende Füchse-Spiele", `${upcoming.length}`,
    upcoming.map(g=>gameCard(g,true)).join("") + (upcoming[0]?countdownBox(upcoming[0]):""));
  out += panel("Alle Spiele", `${list.length} von ${state.games.length}`,
    bar + (list.length?list.map(g=>gameCard(g,false)).join(""):`<p class="empty">Keine Spiele für diese Auswahl.</p>`)
    + (state.isEditor?formGame():""));
  return out;
}

/* ---- HBL ---- */
const TCOLS=[["pos","Pl."],["team","Team"],["sp","Sp"],["w","S"],["d","U"],["l","N"],["gf","Tore"],["diff","Diff"],["pts","Punkte"]];
function tableBlock(st){
  let calc=computeTable(st?st.rows:[]);
  const s=state.sortTab;
  if(s.key!=="pos"){
    calc=calc.slice().sort((a,b)=>{
      let x=a[s.key],y=b[s.key];
      if(s.key==="team") return s.dir==="asc"?String(x).localeCompare(String(y)):String(y).localeCompare(String(x));
      x=Number(x)||0; y=Number(y)||0; return s.dir==="asc"?x-y:y-x;
    });
  } else if(s.dir==="desc") calc=calc.slice().reverse();
  const head=TCOLS.map(([k,l])=>`<th class="sortable${k==="team"?"":" n"}" data-sort="${k}">${esc(l)}${s.key===k?` <span class="arr">${s.dir==="asc"?"▲":"▼"}</span>`:""}</th>`).join("");
  if(!calc.length) return `<p class="empty">Keine Tabelle hinterlegt.</p>`;
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>
    ${calc.map(r=>`<tr class="${r.team===ME?"me":""}"><td class="n">${r.pos}</td><td>${teamline(r.team)}</td>
      <td class="n">${r.sp}</td><td class="n">${r.w||0}</td><td class="n">${r.d||0}</td><td class="n">${r.l||0}</td>
      <td class="n">${r.gf||0}:${r.ga||0}</td><td class="n">${r.diff>0?"+":""}${r.diff}</td>
      <td class="n"><strong>${r.pts}:${r.neg}</strong></td></tr>`).join("")}</tbody></table></div>
    ${st&&st.source?`<p class="hint" style="margin-top:10px">Quelle: ${esc(st.source)}${st.as_of?" · "+esc(st.as_of):""}</p>`:""}`;
}
function viewHBL(){
  const st=latestStandings();
  const hblGames=state.games.filter(g=>g.competition==="Handball-Bundesliga").sort((a,b)=> gkey(a)<gkey(b)?1:-1);
  const recent=hblGames.filter(g=>g.status==="beendet").slice(0,9);
  const next=hblGames.filter(g=>g.status!=="beendet").reverse().slice(0,9);
  const news=state.news.filter(n=>n.scope==="hbl");
  const r=rankOf(ME);
  let out = panel("Tabelle", "Spalte antippen zum Sortieren", tableBlock(st));
  if(r) out += panel("Die Füchse in der Liga","",
    `<div class="kv">
      <div><span>Platz</span><span>${r.pos}.</span></div>
      <div><span>Punkte</span><span>${r.pts}:${r.neg}</span></div>
      <div><span>Tordifferenz</span><span>${r.diff>0?"+":""}${r.diff}</span></div>
      <div><span>Form</span><span>${formDots(ME)}</span></div>
    </div>`);
  if(next.length) out += panel("Kommende Partien", `${next.length}`, next.map(g=>gameCard(g,true)).join(""));
  if(recent.length) out += panel("Letzte Ergebnisse", `${recent.length}`, recent.map(g=>gameCard(g,true)).join(""));
  out += panel("HBL-News", `${news.length}`, news.length?news.map(newsCard).join(""):`<p class="empty">Keine Meldungen erfasst.</p>`);
  return out;
}

/* ---- Archiv (Spieltage) ---- */
const ATABS=[["overview","Übersicht"],["games","Spiele"],["injuries","Verletzungen"],["transfers","Transfers"],["table","Tabelle"],["scout","Gegner"]];
function curMd(){ return state.matchdays.find(m=>m.id===state.archivId)||null; }
function mdItems(arr){ return arr.filter(x=>x.matchday_id===state.archivId); }
function viewArchiv(){
  const m=curMd();
  if(!m) return panel("Archiv","",`<p class="empty">Kein Spieltag ausgewählt.</p>`);
  const sub=`<div class="tabs" style="margin-top:0">${ATABS.map(([k,l])=>
    `<button class="tab" data-atab="${k}" aria-selected="${state.archivTab===k}">${esc(l)}</button>`).join("")}</div>`;
  const g=mdItems(state.games), i=mdItems(state.injuries), t=mdItems(state.transfers);
  const st=state.standings.find(x=>x.matchday_id===m.id);
  const sc=state.scouting.find(x=>x.matchday_id===m.id);
  let body="";
  if(state.archivTab==="overview"){
    let w=0,d=0,l=0,gf=0,ga=0;
    g.forEach(x=>{ const o=outcomeFor(ME,x); if(!o) return; gf+=o.gf; ga+=o.ga;
      if(o.res==="w")w++; else if(o.res==="d")d++; else l++; });
    body = `<div class="tiles">
      <div class="tile"><span>Bilanz Füchse</span><b>${w}-${d}-${l}</b><small>${gf}:${ga} Tore</small></div>
      <div class="tile"><span>Spiele</span><b>${g.length}</b><small>${g.filter(x=>x.status==="beendet").length} beendet</small></div>
      <div class="tile"><span>Ausfälle</span><b>${i.length}</b><small>${esc(i.slice(0,2).map(x=>x.player).join(", ")||"keine")}</small></div>
      <div class="tile"><span>Transfers</span><b>${t.length}</b></div></div>
      ${m.notes?`<p style="margin-top:14px;color:var(--text-2)">${esc(m.notes)}</p>`:""}
      ${state.isEditor?`<div class="formfoot"><button class="btn sm" data-editmd="1">Spieltag bearbeiten</button>
        <button class="btn sm danger" data-delmd="1">Spieltag löschen</button></div>`:""}`;
  }
  if(state.archivTab==="games") body = (g.length?g.sort((a,b)=>gkey(a)<gkey(b)?-1:1).map(x=>gameCard(x,!state.isEditor)).join(""):`<p class="empty">Keine Spiele.</p>`) + (state.isEditor?formGame():"");
  if(state.archivTab==="injuries") body = (i.length?i.map(injuryItem).join(""):`<p class="empty">Keine Ausfälle.</p>`) + (state.isEditor?formInjury():"");
  if(state.archivTab==="transfers") body = (t.length?t.map(transferItem).join(""):`<p class="empty">Keine Transfers.</p>`) + (state.isEditor?formTransfer():"");
  if(state.archivTab==="table") body = tableBlock(st) + (state.isEditor?formStandings(st):"");
  if(state.archivTab==="scout"){
    body = sc ? `<div class="kv">
        <div><span>Gegner</span><span>${esc(sc.opponent||"")}</span></div>
        <div><span>Wettbewerb</span><span>${esc(sc.comp||"")}</span></div>
        <div><span>Anwurf</span><span>${esc(sc.throw_off||"")}</span></div>
        <div><span>Spielort</span><span>${esc(sc.venue||"")}</span></div>
        <div><span>Tabellenplatz</span><span>${esc(sc.rank||"")}</span></div>
        <div><span>Trainer</span><span>${esc(sc.coach||"")}</span></div></div>
      ${["form","players","injuries","tactics","h2h","news","know"].map(k=> sc[k]
        ? `<h4 style="font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-top:14px">${
            {form:"Form",players:"Kader",injuries:"Ausfälle",tactics:"Taktik",h2h:"Direkte Duelle",news:"News",know:"Das sollten die Füchse wissen"}[k]
          }</h4><div style="white-space:pre-wrap;font-size:14px">${esc(sc[k])}</div>` : "").join("")}
      ${sc.sources?`<p class="hint" style="margin-top:10px">Quellen: ${esc(sc.sources)}</p>`:""}`
      : `<p class="empty">Kein Dossier hinterlegt.</p>`;
    if(state.isEditor) body += formScout(sc);
  }
  return panel(esc(m.label||"Spieltag"),
    `${esc(m.competition||"")} · ${deDate(m.date_from)}${m.date_to&&m.date_to!==m.date_from?" – "+deDate(m.date_to):""}`,
    sub + `<div style="margin-top:12px">${body}</div>`);
}

}

/* ===== Dialoge ===== */
function openLogin(){
  $("#dlgTitle").textContent="Anmelden";
  $("#dlgBody").innerHTML=`<p class="hint" style="margin-bottom:10px">Diese Seite ist einer einzigen Kennung vorbehalten.
    Andere Anmeldungen werden abgewiesen, auch wenn das Passwort stimmt.</p>
    <form class="grid" id="fLogin">${inp("email","E-Mail","email","",1)}${inp("password","Passwort","password","",1)}
    <div class="full formfoot"><button class="btn primary" type="submit">Anmelden</button></div></form>`;
  $("#dlg").showModal();
  $("#fLogin").addEventListener("submit", async ev=>{
    ev.preventDefault(); const d=fd(ev.target);
    try{ await login(d.email,d.password); }catch(err){ toast("Anmeldung fehlgeschlagen: "+err.message); return; }
    /* login() lässt nur eine geprüfte Sitzung zurückkommen – vorhanden heißt berechtigt. */
    state.isEditor = !!session;
    $("#dlg").close(); toast("Angemeldet.");
    await reload();
  });
}
function openMatchdayDialog(m){
  m=m||{};
  $("#dlgTitle").textContent=m.id?"Spieltag bearbeiten":"Neuen Spieltag anlegen";
  $("#dlgBody").innerHTML=`<form class="grid" id="fMd">
    ${inp("season","Saison","text",m.season||"2026/27")}
    ${sel("competition","Wettbewerb",COMPS,m.competition||"Handball-Bundesliga")}
    ${inp("number","Spieltag / Runde","text",m.number||"")}
    ${inp("date_from","Von","date",(m.date_from||"").slice(0,10))}
    ${inp("date_to","Bis","date",(m.date_to||"").slice(0,10))}
    ${inp("label","Bezeichnung","text",m.label||"",1)}
    ${txt("notes","Notiz",m.notes||"")}
    <div class="full formfoot"><button class="btn primary" type="submit">${m.id?"Speichern":"Anlegen"}</button></div></form>`;
  $("#dlg").showModal();
  $("#fMd").addEventListener("submit", async ev=>{
    ev.preventDefault(); const d=fd(ev.target);
    if(!d.number){ toast("Bitte Spieltag angeben."); return; }
    const short=d.competition==="Handball-Bundesliga"?"HBL":d.competition==="EHF Champions League"?"CL"
      :d.competition==="EHF European League"?"EL":d.competition==="DHB-Pokal"?"Pokal"
      :d.competition==="IHF Klub-WM"?"Klub-WM":"Spiel";
    const row={season:d.season,competition:d.competition,competition_short:short,number:d.number,
      date_from:nn(d.date_from),date_to:nn(d.date_to)||nn(d.date_from),notes:nn(d.notes),
      label:d.label||`${short} ${d.number} · ${d.season}`,
      sort_key:`${d.season}|${String(d.number).padStart(3,"0")}|${short}`};
    let created;
    try{ created = m.id ? await updateRow("fb_matchdays",m.id,row) : await insertRow("fb_matchdays",row); }
    catch(err){ toast("Speichern fehlgeschlagen: "+err.message); return; }
    if(!m.id && created && created[0]) state.archivId=created[0].id;
    $("#dlg").close(); await reload(); toast("Gespeichert.");
  });
}
function renderLogoList(){
  const host=$("#logoList"); if(!host) return;
  host.innerHTML=Object.keys(TEAMS).map((n,i)=>`<div class="logorow">${badge(n)}
    <span class="nm">${esc(n)}</span>
    <label class="btn sm" for="lf${i}">${state.logos[n]?"Ersetzen":"Bild wählen"}</label>
    <input type="file" id="lf${i}" data-team="${esc(n)}" accept="image/*" hidden>
    ${state.logos[n]?`<button class="btn sm danger" type="button" data-rmlogo="${esc(n)}">Entfernen</button>`:""}</div>`).join("");
}
function openLogoDialog(){
  $("#dlgTitle").textContent="Team-Logos verwalten";
  $("#dlgBody").innerHTML=`<p class="hint" style="margin-bottom:10px">Bild vom Gerät wählen oder Bild-Adresse eintragen.
    Verwende nur Bilder, die du verwenden darfst.</p>
    <form class="grid" id="fLogoUrl">${selTeams("team","Team","")}${inp("url","Bild-Adresse","text","")}
      <div class="full formfoot"><button class="btn" type="submit">Adresse übernehmen</button></div></form>
    <div id="logoList" style="margin-top:6px"></div>`;
  $("#dlg").showModal(); renderLogoList();
  $("#fLogoUrl").addEventListener("submit", async ev=>{
    ev.preventDefault(); const d=fd(ev.target);
    if(!d.team||!d.url){ toast("Team und Adresse angeben."); return; }
    await saveLogo(d.team,d.url);
  });
}
async function saveLogo(team,url){
  try{
    if(url) await upsertRow("fb_team_logos",{team,url},"team");
    else await deleteWhere("fb_team_logos","team",team);
  }catch(e){ toast("Logo speichern fehlgeschlagen: "+e.message); return; }
  await reload(); renderLogoList(); toast(url?"Logo gespeichert.":"Logo entfernt.");
}
function shrinkImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    if(/^image\/svg/i.test(file.type)){ cb(r.result); return; }
    const img=new Image();
    img.onload=()=>{ const max=128,s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/png")); };
    img.onerror=()=>toast("Bild konnte nicht gelesen werden.");
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function doExport(){
  const dump={matchdays:state.matchdays,games:state.games,injuries:state.injuries,transfers:state.transfers,
    standings:state.standings,scouting:state.scouting,news:state.news,squad:state.squad};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(dump,null,2)],{type:"application/json"}));
  a.download="fuchsbau_export_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Export erstellt.");
}

/* ===== Events ===== */
document.addEventListener("click", async ev=>{
  const th=ev.target.closest("th[data-sort]");
  if(th){ const k=th.dataset.sort,s=state.sortTab;
    if(s.key===k) s.dir=s.dir==="asc"?"desc":"asc"; else { s.key=k; s.dir=(k==="team"||k==="pos")?"asc":"desc"; }
    renderView(); return; }
  const t=ev.target.closest("button"); if(!t) return;
  if(t.id==="btnLogin"){ openLogin(); return; }
  if(t.id==="btnLogout"){ await logout(); state.isEditor=false; await reload(); toast("Abgemeldet."); return; }
  if(t.id==="dlgClose"){ $("#dlg").close(); return; }
  if(t.id==="btnExport"){ doExport(); return; }
  if(t.id==="btnLogos"){ openLogoDialog(); return; }
  if(t.dataset.rmlogo){ await saveLogo(t.dataset.rmlogo,null); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.dataset.atab){ state.archivTab=t.dataset.atab; renderView(); return; }
  if(t.dataset.md){ state.archivId=t.dataset.md; renderSubnav(); renderView(); return; }
  if(t.dataset.new){ openMatchdayDialog(); return; }
  if(t.dataset.toggle){ state.fGames[t.dataset.toggle]=!state.fGames[t.dataset.toggle]; renderView(); return; }
  if(t.dataset.reset){ const k=t.dataset.reset;
    if(k==="fGames") state.fGames={comp:"",team:"",onlyMe:false,dir:"desc",state:""};
    if(k==="fInj") state.fInj={team:"",status:""};
    if(k==="fTr") state.fTr={status:""};
    if(k==="fNews") state.fNews={cat:"",status:""};
    if(k==="fTicker") state.fTicker={q:"",scope:"",cat:"",status:"",tage:""};
    renderView(); return; }
  if(t.dataset.editmd){ openMatchdayDialog(curMd()); return; }
  if(t.dataset.delmd){
    if(!confirm("Spieltag mit allen Einträgen löschen?")) return;
    try{ await deleteWhere("fb_matchdays","id",state.archivId); }catch(e){ toast("Löschen fehlgeschlagen: "+e.message); return; }
    state.archivId=null; await reload(); toast("Gelöscht."); return; }
  if(t.dataset.del){ if(!confirm("Eintrag wirklich löschen?")) return; await removeRow(t.dataset.del,t.dataset.id); return; }
  if(t.dataset.edit){
    const coll=t.dataset.edit,id=t.dataset.id;
    const rec=({games:state.games,injuries:state.injuries,transfers:state.transfers,news:state.news}[coll]||[]).find(x=>x.id===id);
    if(!rec) return;
    renderView();
    const host=$("#view fieldset:last-of-type"); if(!host) return;
    host.outerHTML = coll==="games"?formGame(rec):coll==="injuries"?formInjury(rec)
      :coll==="transfers"?formTransfer(rec):formNews(rec);
    $("#view fieldset:last-of-type").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if(t.dataset.cancel){ renderView(); return; }
  if(t.id==="fillHBL"){
    const st=state.standings.find(x=>x.matchday_id===state.archivId);
    const rows=(st&&st.rows)?st.rows.slice():[];
    HBL18.forEach(team=>{ if(!rows.some(r=>r.team===team)) rows.push({team,w:0,d:0,l:0,gf:0,ga:0}); });
    await saveByMd("fb_standings",Object.assign({source:null,as_of:null},st,{matchday_id:state.archivId,rows}));
    toast("HBL-Teams angelegt."); return; }
});

document.addEventListener("input", ev=>{
  const e=ev.target;
  if(e.dataset.fk==="q"){ state.fTicker.q=e.value; tickerAktualisieren(); }
});

document.addEventListener("change", ev=>{
  const e=ev.target;
  if(e.dataset.fg){ state.fGames[e.dataset.fg]=e.value; renderView(); return; }
  if(e.dataset.fi){ state.fInj[e.dataset.fi]=e.value; renderView(); return; }
  if(e.dataset.ft){ state.fTr[e.dataset.ft]=e.value; renderView(); return; }
  if(e.dataset.fn){ state.fNews[e.dataset.fn]=e.value; renderView(); return; }
  /* Das Suchfeld wird schon beim Tippen ausgewertet. Würde es hier beim Verlassen
     noch einmal die ganze Ansicht neu zeichnen, ginge der Klick verloren, der den
     Fokus gerade weggenommen hat – etwa auf "Filter zurücksetzen". */
  if(e.dataset.fk && e.dataset.fk!=="q"){ state.fTicker[e.dataset.fk]=e.value; renderView(); return; }
  if(e.dataset.team && e.files && e.files[0]){
    const team=e.dataset.team; shrinkImage(e.files[0],src=>saveLogo(team,src)); e.value="";
  }
});

document.addEventListener("submit", async ev=>{
  const f=ev.target; if(!f.id||["fMd","fLogin","fLogoUrl"].includes(f.id)) return;
  ev.preventDefault();
  const d=fd(f);
  const md = nn(d.matchday_id) || null;
  if(f.id==="fNewsForm"){
    if(!d.title){ toast("Bitte eine Überschrift angeben."); return; }
    const row={scope:d.scope,category:d.category,importance:d.importance,status:d.status,title:d.title,
      summary:nn(d.summary),
      teams:d.teams?d.teams.split(",").map(x=>x.trim()).filter(Boolean):[],
      players:d.players?d.players.split(",").map(x=>x.trim()).filter(Boolean):[],
      published_at:nn(d.published_at), published_time_known:d.published_time_known!=="false",
      is_update:d.is_update==="true", matchday_id:md,
      source_name:nn(d.source_name), source_url:nn(d.source_url), conflict_note:nn(d.conflict_note),
      updated_at:new Date().toISOString()};
    if(await save("fb_news",row,f.dataset.id||null)) toast("Meldung gespeichert."); return;
  }
  if(f.id==="fGame"){
    if(!d.home||!d.away||!d.match_date){ toast("Heim, Gast und Datum sind Pflicht."); return; }
    const row={matchday_id:md,competition:d.competition,round:nn(d.round),match_date:d.match_date,
      match_time:nn(d.match_time),home:d.home,away:d.away,gh:num(d.gh),ga:num(d.ga),hh:num(d.hh),ha:num(d.ha),
      date_window:nn(d.date_window),date_exact:d.date_exact!=="false",
      venue:nn(d.venue),spectators:num(d.spectators),status:d.status,verif:d.verif,scorers:nn(d.scorers),
      keeper:nn(d.keeper),penalties:nn(d.penalties),course:nn(d.course),source:nn(d.source)};
    if(await save("fb_games",row,f.dataset.id||null)) toast("Spiel gespeichert."); return;
  }
  if(f.id==="fInjury"){
    if(!d.player){ toast("Bitte Spielernamen angeben."); return; }
    const row={matchday_id:md,player:d.player,team:d.team||ME,kind:nn(d.kind),status:d.status,
      since:nn(d.since),ret:nn(d.ret),training:nn(d.training),affected_games:nn(d.affected_games),source:nn(d.source)};
    if(await save("fb_injuries",row,f.dataset.id||null)) toast("Ausfall gespeichert."); return;
  }
  if(f.id==="fTransfer"){
    if(!d.player){ toast("Bitte Spielernamen angeben."); return; }
    const row={matchday_id:md,player:d.player,position:nn(d.position),from_club:nn(d.from_club),to_club:nn(d.to_club),
      contract:nn(d.contract),transfer_when:nn(d.transfer_when),status:d.status,report_date:nn(d.report_date),
      source:nn(d.source),note:nn(d.note)};
    if(await save("fb_transfers",row,f.dataset.id||null)) toast("Transfer gespeichert."); return;
  }
  if(f.id==="fSquad"){
    if(!d.team||!d.player){ toast("Verein und Spieler angeben."); return; }
    const row={team:d.team,player:d.player,shirt_no:nn(d.shirt_no),position:nn(d.position),nationality:nn(d.nationality),
      role:nn(d.role),is_key:d.is_key==="true",stat_games:num(d.stat_games),stat_goals:num(d.stat_goals),
      stat_note:nn(d.stat_note),source:nn(d.source)};
    if(await save("fb_squad",row,null)) toast("Spieler gespeichert."); return;
  }
  if(f.id==="fRow"){
    if(!d.team){ toast("Bitte ein Team wählen."); return; }
    const base=state.standings.find(x=>x.matchday_id===state.archivId)||{matchday_id:state.archivId,rows:[],source:null,as_of:null};
    const rows=(base.rows||[]).filter(r=>r.team!==d.team);
    rows.push({team:d.team,w:num(d.w)||0,d:num(d.d)||0,l:num(d.l)||0,gf:num(d.gf)||0,ga:num(d.ga)||0});
    if(await saveByMd("fb_standings",Object.assign({},base,{matchday_id:state.archivId,rows}))) toast("Gespeichert."); return;
  }
  if(f.id==="fSrc"){
    const base=state.standings.find(x=>x.matchday_id===state.archivId)||{matchday_id:state.archivId,rows:[]};
    if(await saveByMd("fb_standings",Object.assign({},base,{matchday_id:state.archivId,source:nn(d.source),as_of:nn(d.as_of)}))) toast("Quelle gespeichert."); return;
  }
  if(f.id==="fScout"){
    const row=Object.fromEntries(Object.entries(d).map(([k,v])=>[k,nn(v)]));
    row.matchday_id=state.archivId;
    if(await saveByMd("fb_scouting",row)) toast("Dossier gespeichert."); return;
  }
});

$("#dlg").addEventListener("close", ()=>{ $("#dlgBody").innerHTML=""; });

/* ===== Start ===== */
(async function start(){
  if(ROLE==="editor") await restoreSession(); else setSession(null);
  if(session && session.expires_at && session.expires_at < (Math.floor(Date.now()/1000)+60)) await refreshSession();
  /* Jede Sitzung, die restoreSession/refreshSession übersteht, ist bereits geprüft. */
  state.isEditor = ROLE==="editor" && !!session;
  await reload();
  if(ROLE==="editor"){
    setInterval(()=>{ if(session) refreshSession(); }, 45*60*1000);
    if(!state.isEditor) openLogin();
  }
  setInterval(reload, 10*60*1000);
})();
